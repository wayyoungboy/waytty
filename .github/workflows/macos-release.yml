name: macOS release verification

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      FLUTTER_REVISION: d3b14c876900e553bc736ca19295fc09e3853e8e
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Flutter and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "WAYTTY_FLUTTER=$RUNNER_TEMP/flutter/bin/flutter" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"
          brew install automake libtool gitleaks
          python3 -m venv "$RUNNER_TEMP/ssh-fixture"
          "$RUNNER_TEMP/ssh-fixture/bin/pip" install asyncssh==2.21.1
          echo "WAYTTY_SSH_FIXTURE_PYTHON=$RUNNER_TEMP/ssh-fixture/bin/python" >> "$GITHUB_ENV"
      - name: Verify source, localization and regressions
        run: |
          python3 -m unittest discover -s script -p 'test_*.py' -v
          python3 script/check_privacy.py --history
          ./script/check_crossplatform.sh
      - name: Build Universal macOS application
        run: ./script/package_macos_release.sh
      - name: Validate and assemble release attachments
        run: python3 script/assemble_release.py
      - name: Upload verified attachments
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waytty-macos-release
          path: |
            dist/release/*/*.zip
            dist/release/*/SHA256SUMS.txt
            dist/release/*/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
