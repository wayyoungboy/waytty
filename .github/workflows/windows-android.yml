name: Windows and Android builds

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_REVISION: d3b14c876900e553bc736ca19295fc09e3853e8e
  FLUTTER_VERSION: '3.47.2'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "WAYTTY_FLUTTER=$RUNNER_TEMP/flutter/bin/flutter" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"

      - name: Install Android SDK components
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
          accept-android-sdk-licenses: true

      - name: Configure Flutter Android SDK
        shell: bash
        run: |
          set -euo pipefail
          flutter config --android-sdk "$ANDROID_SDK_ROOT"
          flutter doctor -v

      - name: Prepare release keystore when secrets are present
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEY_PROPS="crossplatform/app/android/key.properties"
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            STORE_FILE="$RUNNER_TEMP/waytty-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
            {
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "storeFile=${STORE_FILE}"
            } > "$KEY_PROPS"
            echo "Release keystore written for Gradle signing."
            echo "ANDROID_SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "ANDROID_SIGNING=debug-fallback" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_* secrets not fully configured; Android artifacts will be debug-signed."
          fi

      - name: Build Android release packages
        run: ./script/build_android.sh

      - name: Summarize Android signing
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Android build"
            echo
            echo "- Signing mode: \`${ANDROID_SIGNING}\`"
            echo "- Version: \`$(sed -n 's/^version: //p' crossplatform/app/pubspec.yaml)\`"
            echo
            echo '### Artifacts'
            echo '```'
            ls -lh dist/release/*/waytty-*-android* dist/release/*/SHA256SUMS-android.txt dist/release/*/BUILD_INFO-android.txt 2>/dev/null || true
            echo '```'
            if [[ "${ANDROID_SIGNING}" == "debug-fallback" ]]; then
              echo
              echo '> Debug-signed only. Add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD before publishing.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waytty-android-release
          path: |
            dist/release/*/waytty-*-android*.apk
            dist/release/*/waytty-*-android.aab
            dist/release/*/SHA256SUMS-android.txt
            dist/release/*/BUILD_INFO-android.txt
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "WAYTTY_FLUTTER=$RUNNER_TEMP/flutter/bin/flutter" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"
          # Enable Windows desktop embedding.
          "$RUNNER_TEMP/flutter/bin/flutter" config --enable-windows-desktop

      - name: Install Clang for QuickJS (qjsbridge.dll)
        shell: pwsh
        run: |
          $clang = Get-Command clang -ErrorAction SilentlyContinue
          if (-not $clang) {
            choco install llvm -y --no-progress
            $llvmBin = 'C:\Program Files\LLVM\bin'
            Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
            $env:Path = "$llvmBin;$env:Path"
          }
          clang --version

      - name: Build Windows portable ZIP
        shell: pwsh
        run: |
          ./script/build_windows.ps1

      - name: Summarize Windows build
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Windows build"
            echo
            echo "- Artifact: portable x64 ZIP (not an installer)"
            echo "- Version: \`$(sed -n 's/^version: //p' crossplatform/app/pubspec.yaml)\`"
            echo
            echo '### Artifacts'
            echo '```'
            ls -lh dist/release/*/waytty-*-windows-x64.zip dist/release/*/SHA256SUMS-windows.txt dist/release/*/BUILD_INFO-windows.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waytty-windows-release
          path: |
            dist/release/*/waytty-*-windows-x64.zip
            dist/release/*/SHA256SUMS-windows.txt
            dist/release/*/BUILD_INFO-windows.txt
          if-no-files-found: error
          retention-days: 14

  # Tag-only draft release attachment. Does not run on PRs/pushes to main, so
  # nothing is published until a v* tag is pushed and a human publishes the draft.
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Android artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: waytty-android-release
          path: dist/ci/android

      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: waytty-windows-release
          path: dist/ci/windows

      - name: Assemble draft release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ci/upload
          find dist/ci -type f \( -name 'waytty-*.apk' -o -name 'waytty-*.aab' -o -name 'waytty-*-windows-x64.zip' -o -name 'SHA256SUMS-*.txt' -o -name 'BUILD_INFO-*.txt' \) \
            -exec cp -v {} dist/ci/upload/ \;
          (
            cd dist/ci/upload
            rm -f SHA256SUMS.txt
            for f in waytty-*.apk waytty-*.aab waytty-*-windows-x64.zip; do
              [[ -f "$f" ]] || continue
              sha256sum "$f" >> SHA256SUMS.txt
            done
            ls -lh
          )

      - name: Create or update DRAFT GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TITLE="waytty ${TAG} (Windows + Android draft)"
          NOTES="$(cat <<'MD'
          ## Windows / Android CI packages (draft)

          These attachments come from the Windows and Android CI workflow.
          They are **not** a substitute for target-device acceptance.

          - Windows: portable x64 ZIP (no installer in this draft path).
          - Android: per-ABI APKs, universal APK, and AAB.
          - Signing: Android uses the release keystore only when `ANDROID_KEYSTORE_*` repository secrets are configured; otherwise artifacts are debug-signed and must not be treated as production.

          Publish this draft only after verifying checksums and (for Android) release signing.
          MD
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ci/upload/* --clobber
          else
            gh release create "$TAG" dist/ci/upload/* \
              --draft \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
