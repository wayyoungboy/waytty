name: Windows and Android builds

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_REVISION: d3b14c876900e553bc736ca19295fc09e3853e8e
  FLUTTER_VERSION: '3.47.2'

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "WAYTTY_FLUTTER=$RUNNER_TEMP/flutter/bin/flutter" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"

      - name: Install Android SDK components
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Preserve the SDK manager used by the verified JDK 17 build.
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
          accept-android-sdk-licenses: true

      - name: Configure Flutter Android SDK
        shell: bash
        run: |
          set -euo pipefail
          flutter config --android-sdk "$ANDROID_SDK_ROOT"
          flutter doctor -v

      - name: Prepare release keystore when secrets are present
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEY_PROPS="crossplatform/app/android/key.properties"
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            STORE_FILE="$RUNNER_TEMP/waytty-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
            {
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "storeFile=${STORE_FILE}"
            } > "$KEY_PROPS"
            echo "Release keystore written for Gradle signing."
            echo "ANDROID_SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "ANDROID_SIGNING=debug-fallback" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_* secrets not fully configured; Android artifacts will be debug-signed."
          fi

      - name: Build Android release packages
        run: ./script/build_android.sh

      - name: Summarize Android signing
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Android build"
            echo
            echo "- Signing mode: \`${ANDROID_SIGNING}\`"
            echo "- Version: \`$(sed -n 's/^version: //p' crossplatform/app/pubspec.yaml)\`"
            echo
            echo '### Artifacts'
            echo '```'
            ls -lh dist/release/*/waytty-*-android* dist/release/*/SHA256SUMS-android.txt dist/release/*/BUILD_INFO-android.txt 2>/dev/null || true
            echo '```'
            if [[ "${ANDROID_SIGNING}" == "debug-fallback" ]]; then
              echo
              echo '> Debug-signed only. Add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD before publishing.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waytty-android-release
          path: |
            dist/release/*/waytty-*-android*.apk
            dist/release/*/waytty-*-android.aab
            dist/release/*/SHA256SUMS-android.txt
            dist/release/*/BUILD_INFO-android.txt
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          # Prefer flutter.bat on Windows so pwsh invokes the real Windows entrypoint.
          echo "WAYTTY_FLUTTER=$RUNNER_TEMP/flutter/bin/flutter.bat" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/flutter/bin/flutter.bat" config --enable-windows-desktop

      - name: Install MinGW for QuickJS (qjsbridge.dll)
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $mingwBin = 'C:\ProgramData\mingw64\mingw64\bin'
          if (Test-Path $mingwBin) {
            Add-Content -Path $env:GITHUB_PATH -Value $mingwBin
            $env:Path = "$mingwBin;$env:Path"
          }
          gcc --version

      - name: Build Windows portable ZIP
        shell: pwsh
        run: |
          ./script/build_windows.ps1

      - name: Summarize Windows build
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Windows build"
            echo
            echo "- Artifact: portable x64 ZIP (not an installer)"
            echo "- Version: \`$(sed -n 's/^version: //p' crossplatform/app/pubspec.yaml)\`"
            echo
            echo '### Artifacts'
            echo '```'
            ls -lh dist/release/*/waytty-*-windows-x64.zip dist/release/*/SHA256SUMS-windows.txt dist/release/*/BUILD_INFO-windows.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waytty-windows-release
          path: |
            dist/release/*/waytty-*-windows-x64.zip
            dist/release/*/SHA256SUMS-windows.txt
            dist/release/*/BUILD_INFO-windows.txt
          if-no-files-found: error
          retention-days: 14

  # Tag-only draft release attachment. Does not run on PRs/pushes to main, so
  # nothing is published until a v* tag is pushed and a human publishes the draft.
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Android artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: waytty-android-release
          path: dist/ci/android

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: waytty-windows-release
          path: dist/ci/windows

      - name: Assemble draft release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ci/upload
          find dist/ci -type f \( -name 'waytty-*.apk' -o -name 'waytty-*.aab' -o -name 'waytty-*-windows-x64.zip' -o -name 'SHA256SUMS-*.txt' -o -name 'BUILD_INFO-*.txt' \) \
            -exec cp -v {} dist/ci/upload/ \;
          (
            cd dist/ci/upload
            rm -f SHA256SUMS.txt
            for f in waytty-*.apk waytty-*.aab waytty-*-windows-x64.zip; do
              [[ -f "$f" ]] || continue
              sha256sum "$f" >> SHA256SUMS.txt
            done
            ls -lh
          )

      - name: Create or update DRAFT GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TITLE="waytty ${TAG}（草稿）"
          NOTES="$(cat <<'MD'
          waytty 草稿发布：Windows 便携包与 Android 调试签名预览版。

          **Android 重要提示（调试签名预览版）：**
          - 本附件为 **debug 签名**，**不可用于生产**。
          - 与未来正式签名包 **无法原地升级**；用户日后安装正式版时可能需要先卸载本预览版。
          - 目标设备尚未验收，不得当作正式发布物。

          **Windows：** 便携 x64 ZIP（本草稿路径不含安装包）。
          **Android：** 分 ABI APK、universal APK 与 AAB。
          **macOS：** 可由 macOS 验证流水线工件另行挂到本草稿；公开发布前请继续使用已发布的 v0.0.2 下载链接。

          仅在核对校验和（及正式 Android 签名）后，再考虑公开本草稿。
          MD
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ci/upload/* --clobber
          else
            gh release create "$TAG" dist/ci/upload/* \
              --draft \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
